services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "80:80"
    env_file: .env
    volumes:
      - ./public:/var/www/diffrakt/public
      - ./src:/var/www/diffrakt/src
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy

  db:
    image: mysql:8
    restart: unless-stopped
    env_file: .env
    volumes:
      - db_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./database/seeds/filters.sql:/docker-entrypoint-initdb.d/02-seeds.sql
      - ./database/migrations/002_reactions_comments.sql:/docker-entrypoint-initdb.d/03-002_reactions_comments.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio
    restart: unless-stopped
    env_file: .env
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  createbuckets:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    env_file: .env
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD;
      mc mb --ignore-existing local/$$S3_BUCKET;
      exit 0;
      "

volumes:
  db_data:
  minio_data: